name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check envVersion against README
        run: |
          set -euo pipefail
          v=$(node tools/bench/bench.mjs version)
          echo "envVersion=$v"
          grep -F "envVersion \`$v\`" README.md
      - name: Short baselines and verify
        run: |
          set -euo pipefail
          mkdir -p bench-out
          node tools/bench/bench.mjs baselines --seeds 1-3 --json bench-out/baselines.json
          node tools/bench/bench.mjs run --agent "node tools/bench/examples/heuristic-agent.mjs" --seeds 1-3 --out bench-out/heuristic
          node tools/bench/bench.mjs verify bench-out/heuristic/summary.json
