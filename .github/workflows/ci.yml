name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check envVersion against README
        shell: bash
        run: |
          set -euo pipefail
          v=$(node tools/bench/bench.mjs version)
          echo "envVersion=$v"
          grep -F "envVersion \`$v\`" README.md
      - name: Short baselines and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-out
          node tools/bench/bench.mjs baselines --seeds 1-3 --json bench-out/baselines.json
          node tools/bench/bench.mjs run --seeds 1-3 --out bench-out/heuristic -- node tools/bench/examples/heuristic-agent.mjs
          node tools/bench/bench.mjs verify bench-out/heuristic/summary.json
          node tools/bench/bench.mjs compare bench-out/heuristic/summary.json bench-out/heuristic/summary.json
